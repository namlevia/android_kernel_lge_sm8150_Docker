name: Build LG flash Docker kernel

on:
  workflow_dispatch:
    inputs:
      ksu:
        description: "Build KernelSU variant"
        required: true
        default: false
        type: boolean
      build_mode:
        description: "Artifact style"
        required: true
        default: anykernel
        type: choice
        options:
          - anykernel
          - magisk
      jobs:
        description: "Parallel make jobs"
        required: true
        default: "8"
        type: string
      publish_release:
        description: "Create/update a GitHub Release after a successful build"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Optional release tag override (leave empty for auto tag)"
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache cpio curl file flex gawk git \
            libelf-dev libssl-dev lld llvm clang make python3 rsync unzip xz-utils zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi


      - name: Show toolchain versions
        run: |
          clang --version
          ld.lld --version
          llvm-ar --version
          aarch64-linux-gnu-gcc --version | head -n 1
          arm-linux-gnueabi-gcc --version | head -n 1

      - name: Prepare build dirs
        run: |
          mkdir -p release/Dragon

      - name: Build flash Docker kernel
        env:
          JOBS: ${{ inputs.jobs }}
          BUILD_MODE: ${{ inputs.build_mode }}
          KSU: ${{ inputs.ksu }}
        run: |
          set -euxo pipefail
          args=(--variant flash --jobs "$JOBS" --clang-path /usr/bin --build "$BUILD_MODE")
          if [ "$KSU" = "true" ]; then
            args+=(--ksu)
          fi
          bash ./build_kernel_docker_quick.sh "${args[@]}"

      - name: Collect artifacts
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          find out/arch/arm64/boot -maxdepth 1 \( -name 'Image' -o -name 'Image.gz' -o -name 'Image.gz-dtb' \) -type f -exec cp -v {} artifacts/ \; || true
          find release/Dragon -maxdepth 2 -type f \( -name 'Image*' -o -name '*.ko' \) -exec cp -v {} artifacts/ \; || true
          cp -v .config artifacts/kernel.config || true

      - name: Generate release metadata
        if: ${{ inputs.publish_release }}
        env:
          BUILD_MODE: ${{ inputs.build_mode }}
          KSU: ${{ inputs.ksu }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -f out/include/config/kernel.release ]; then
            kernel_version=$(tr -d '\n' < out/include/config/kernel.release)
          else
            kernel_version=$(make -s O=out kernelrelease 2>/dev/null | tail -n 1 | tr -d '\n')
          fi
          flavor="flash-docker"
          variant_suffix="stock"
          if [ "$KSU" = "true" ]; then
            variant_suffix="ksu"
          fi
          if [ "$BUILD_MODE" = "anykernel" ]; then
            if [ "$KSU" = "true" ]; then
              installer_name="V50-n3x7g3n-AnyKernel3-KSU.zip"
            else
              installer_name="V50-n3x7g3n-AnyKernel3-OpenELA.zip"
            fi
          else
            if [ "$KSU" = "true" ]; then
              installer_name="V50-n3x7g3n-magisk-KSU.zip"
            else
              installer_name="V50-n3x7g3n-magisk-OpenELA.zip"
            fi
          fi
          if [ -n "$RELEASE_TAG_INPUT" ]; then
            release_tag="$RELEASE_TAG_INPUT"
          else
            release_tag="${kernel_version}-${flavor}-${variant_suffix}-${BUILD_MODE}-${GITHUB_RUN_NUMBER}"
          fi
          release_name="$release_tag"
          cat > release-notes.md <<EOF
          Automated build for LG flash Docker kernel.

          ## Build details
          - Branch: ${GITHUB_REF_NAME}
          - Kernel release: ${kernel_version}
          - Variant: flash (LG V50)
          - KSU: ${KSU}
          - Build mode: ${BUILD_MODE}
          - Installer zip: ${installer_name}
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          ## Included release package
          - Installer zip rebuilt from the upstream sidex15 V50 installer template for ${BUILD_MODE}
          - Raw kernel build artifacts remain available in Actions artifacts

          ## Notes
          - This release is CI-generated.
          - Flashing/packaging validation on hardware is still a separate step.
          EOF
          {
            echo "release_tag=$release_tag"
            echo "release_name=$release_name"
            echo "installer_name=$installer_name"
          } >> "$GITHUB_ENV"

      - name: Package release zip
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_MODE: ${{ inputs.build_mode }}
          KSU: ${{ inputs.ksu }}
        run: |
          set -euo pipefail
          stage_dir="packaged/staging"
          out_dir="packaged/out"
          dl_dir="packaged/download"
          rm -rf packaged
          mkdir -p "$stage_dir" "$out_dir" "$dl_dir"

          if [ "$BUILD_MODE" = "anykernel" ]; then
            if [ "$KSU" = "true" ]; then
              template_asset="V50-n3x7g3n-AnyKernel3-KSU.zip"
            else
              template_asset="V50-n3x7g3n-AnyKernel3-OpenELA.zip"
            fi
          else
            if [ "$KSU" = "true" ]; then
              template_asset="V50-n3x7g3n-magisk-KSU.zip"
            else
              template_asset="V50-n3x7g3n-magisk-OpenELA.zip"
            fi
          fi

          gh release download v4.14.355-OpenELA-v7 \
            --repo sidex15/android_kernel_lge_sm8150 \
            --pattern "$template_asset" \
            --dir "$dl_dir"

          unzip -q "$dl_dir/$template_asset" -d "$stage_dir"

          if [ "$BUILD_MODE" = "anykernel" ]; then
            cp -f out/arch/arm64/boot/Image "$stage_dir/Image"
            cp -f release/Dragon/touch_module_s3706.ko "$stage_dir/touch_module_s3706.ko"
          else
            cp -f out/arch/arm64/boot/Image.gz-dtb "$stage_dir/Image.gz-dtb"
            cp -f release/Dragon/touch_module_s3706.ko "$stage_dir/touch_module_s3706.ko"
          fi

          rm -f "$dl_dir/$template_asset"

          (
            cd "$stage_dir"
            zip -r9 "../out/${installer_name}" .
          )
          echo "release_zip=${out_dir}/${installer_name}" >> "$GITHUB_ENV"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flash-docker-${{ inputs.build_mode }}-${{ inputs.ksu && 'ksu' || 'stock' }}
          path: |
            artifacts/
            packaged/
            release-notes.md
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.release_tag }}
          name: ${{ env.release_name }}
          body_path: release-notes.md
          files: |
            ${{ env.release_zip }}
          draft: false
          prerelease: ${{ inputs.ksu }}
          generate_release_notes: false
